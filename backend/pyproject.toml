[project]
name = "datamind-backend"
version = "2.0.0"
description = "DataMind v2: Decoupled Multi-Agent Analytical Workspace & Intelligence Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13.2",
    "pgvector>=0.3.5",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "pwdlib[argon2]>=0.2.1",
    "python-jose[cryptography]>=3.3.0",
    "duckdb>=1.1.0",
    "pyarrow>=17.0.0",
    "redis>=5.0.8",
    "taskiq>=0.11.0",
    "taskiq-redis>=0.5.0",
    "litellm>=1.49.0",
    "langgraph>=0.2.30",
    "scikit-learn>=1.5.2",
    "pandas>=2.2.3",
    "numpy>=1.26.4",
    "openpyxl>=3.1.5",
    "python-multipart>=0.0.12",
    "httpx>=0.27.2",
    "plotly>=5.24.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.6",
    "pyright>=1.1.391",
    "bandit[toml]>=1.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4", "S"]
ignore = ["E501", "B008", "B904"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S108"]

[tool.bandit]
exclude_dirs = [".venv", "tests"]
skips = ["B101"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
include = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

