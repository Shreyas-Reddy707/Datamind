services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: datamind_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - datamind_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: datamind_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - datamind_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  datamind_pgdata:
    name: datamind_pgdata
  datamind_redisdata:
    name: datamind_redisdata

